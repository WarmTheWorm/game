<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SFX Kit Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: synth workstation. Top transport bar; left rail of presets + saved sounds; main area = scope, layer timeline, layer inspector, export. Single dark look by choice, matching SFX/KIT. */
:root{
  --bg:#17122a; --panel:#211a3a; --panel2:#2b2249; --line:#3d3263; --line2:#52457f;
  --fg:#efe9ff; --muted:#a69cc9; --amber:#ffb547; --pink:#ff6fae; --mint:#6ff0c8; --sky:#7cc4ff; --lilac:#c9a2ff;
  --display:"Silkscreen",ui-monospace,monospace;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);color:#1c1430;border-color:var(--amber);font-weight:500}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--pink);color:var(--pink)}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pb{padding:12px 14px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;color:var(--amber);margin:0;line-height:1}
.logo span{color:var(--pink)}
.namebox{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-family:var(--mono);direction:ltr}
.namebox span{color:var(--muted)}
.namebox input{background:transparent;border:0;color:var(--amber);font:inherit;width:12ch;outline:none}
.top .grow{flex:1}
.transport{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.toggle input{accent-color:var(--amber)}

.main{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}

/* rail */
.rail{display:grid;gap:16px}
.list{display:grid;gap:2px;padding:6px}
.item{appearance:none;border:0;background:transparent;text-align:start;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item:hover{background:var(--panel2)}
.item.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.item b{font-family:var(--mono);font-weight:500;font-size:13px;direction:ltr}
.item small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:8px 10px;margin:0}
@media (max-width:820px){.list.presets{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}

.work{display:grid;gap:16px;min-width:0}

/* scope + timeline */
.tl{direction:ltr}
#scope{display:block;width:100%;height:56px;border-bottom:1px solid var(--line)}
.tlwrap{position:relative;padding:8px 0 4px}
#timeline{display:block;width:100%;cursor:default;touch-action:pan-y}
.tlhint{font-size:12px;color:var(--muted);padding:0 14px 10px;margin:0}

/* layer chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px 4px 10px;cursor:pointer;display:flex;gap:7px;align-items:center;font-family:var(--mono);font-size:12px;direction:ltr}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.on{border-color:var(--fg)}

/* inspector */
.insp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 22px}
.ctl{display:grid;gap:4px;min-width:0}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-size:13px;color:var(--muted)}
.ctl output{font-family:var(--mono);font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums;direction:ltr}
input[type=range]{width:100%;accent-color:var(--amber)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;direction:ltr}
.seg button{appearance:none;flex:1;border:0;background:transparent;padding:6px 0;cursor:pointer;display:grid;place-items:center;gap:2px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel2);color:var(--amber)}
.seg svg{width:26px;height:12px}
.inspfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;direction:ltr;text-align:left;color:#ddd5f7}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--mint);color:#13261f;padding:8px 14px;border-radius:8px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show span{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast span{transition:none}}
</style>

<div class="wrap" dir="ltr">
  <div class="top">
    <h1 class="logo" dir="ltr">SFX<span>/</span>EDIT</h1>
    <label class="namebox" for="name"><span>sfx.</span><input id="name" value="coin" spellcheck="false" aria-label="Sound name"><span>()</span></label>
    <div class="grow"></div>
    <div class="transport">
      <button class="btn primary" id="play" type="button">▶ Play <small>(Space)</small></button>
      <button class="btn" id="mutate" type="button">Mutate</button>
      <button class="btn" id="random" type="button">Random</button>
      <button class="btn" id="save" type="button">Save to library</button>
    </div>
    <label class="toggle" for="auto"><input type="checkbox" id="auto" checked> Play on change</label>
    <label class="toggle" for="vol">Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5" style="width:90px"></label>
  </div>

  <div class="main">
    <aside class="rail">
      <div class="panel">
        <div class="ph"><h2>Presets</h2></div>
        <div class="list presets" id="presets"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>My sounds</h2></div>
        <div class="list" id="mine"></div>
      </div>
    </aside>

    <div class="work">
      <div class="panel tl">
        <canvas id="scope" aria-hidden="true"></canvas>
        <div class="tlwrap"><canvas id="timeline" aria-label="Layer timeline"></canvas></div>
        <p class="tlhint">Drag a layer to move it in time, or drag its right edge to change its length. The line inside each layer shows its pitch (or filter) sweep.</p>
      </div>

      <div class="panel">
        <div class="ph">
          <div class="chips" id="chips"></div>
          <div class="transport">
            <button class="btn ghost" id="addTone" type="button">+ Oscillator</button>
            <button class="btn ghost" id="addNoise" type="button">+ Noise</button>
          </div>
        </div>
        <div class="pb">
          <div class="insp" id="insp"></div>
          <div class="inspfoot">
            <button class="btn" id="solo" type="button">Play layer only</button>
            <button class="btn" id="dup" type="button">Duplicate layer</button>
            <button class="btn danger" id="del" type="button">Delete layer</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="ph">
          <h2>Export code</h2>
          <div class="transport">
            <button class="btn" id="copyCode" type="button">Copy sound</button>
            <button class="btn" id="copyHelper" type="button">Copy shared code</button>
            <button class="btn" id="copyLib" type="button">Copy my library</button>
          </div>
        </div>
        <pre id="code"></pre>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span></span></div>

<script>
// ---------- shared helper (identical to SFX/KIT, so exported code drops straight in) ----------
const HELPER = `const sfx = {
  ctx: null,
  master: null,
  volume: 0.5,
  unlock() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.volume;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone({ type = "square", from = 440, to = from, dur = 0.1,
         vol = 0.3, delay = 0, attack = 0.005 } = {}) {
    const ctx = this.unlock();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    if (to !== from) osc.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },
  noise({ dur = 0.3, vol = 0.4, from = 4000, to = 200, delay = 0 } = {}) {
    const ctx = this.unlock();
    const t = ctx.currentTime + delay;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
  },
};`;
const sfx = (new Function(HELPER + "\nreturn sfx;"))();
let analyser = null;
const _unlock = sfx.unlock.bind(sfx);
sfx.unlock = function(){
  const first = !this.ctx, ctx = _unlock();
  if (first){ analyser = ctx.createAnalyser(); analyser.fftSize = 1024; this.master.connect(analyser); }
  return ctx;
};

// ---------- data ----------
const T = (type, from, to, dur, vol, delay=0, attack=0.005) => ({kind:"tone", type, from, to, dur, vol, delay, attack});
const N = (from, to, dur, vol, delay=0) => ({kind:"noise", from, to, dur, vol, delay});
const PRESETS = [
  {name:"click", he:"Click", layers:[T("square",1200,600,.03,.2)]},
  {name:"blip", he:"Blip", layers:[T("square",880,880,.07,.2)]},
  {name:"select", he:"Select", layers:[T("square",660,660,.06,.2), T("square",990,990,.09,.2,.06)]},
  {name:"coin", he:"Coin", layers:[T("square",988,988,.08,.2), T("square",1319,1319,.3,.2,.08)]},
  {name:"jump", he:"Jump", layers:[T("square",220,880,.18,.22)]},
  {name:"laser", he:"Laser", layers:[T("sawtooth",1800,120,.22,.18)]},
  {name:"hit", he:"Hit", layers:[T("sawtooth",300,60,.18,.3), N(3000,300,.12,.25)]},
  {name:"explosion", he:"Explosion", layers:[N(2500,60,.8,.6), T("sine",120,30,.6,.5)]},
  {name:"powerup", he:"Power-up", layers:[523,659,784,1047,1319].map((f,i)=>T("square",f,Math.round(f*1.02),.09,.18,+(i*.06).toFixed(2)))},
  {name:"error", he:"Error", layers:[T("square",180,180,.12,.22), T("square",140,140,.2,.22,.13)]},
  {name:"win", he:"Win", layers:[...[523,659,784,1047].map((f,i)=>T("triangle",f,f,.14,.3,+(i*.11).toFixed(2))), T("square",1047,1047,.45,.15,.44)]},
  {name:"gameOver", he:"Game over", layers:[392,330,262,196].map((f,i)=>T("triangle",f,Math.round(f*.97),.3,.3,+(i*.25).toFixed(2)))},
];
const COLORS = ["#ffb547","#ff6fae","#6ff0c8","#7cc4ff","#c9a2ff"];
const WAVES = ["square","sine","triangle","sawtooth"];
const WAVE_PATHS = {
  square:"M1 10V2h6v8h6V2h6v8h6", sine:"M1 6C4 -1 7 -1 10 6S16 13 19 6 24 0 25 3",
  triangle:"M1 10L7 2l6 8 6-8 6 8", sawtooth:"M1 10L9 2v8l8-8v8l8-8",
};
const FREQ_MIN = 20, FREQ_MAX = 8000;
const SPEC = {
  tone:[
    {k:"type", label:"Waveform", kind:"wave"},
    {k:"from", label:"Start pitch", kind:"freq"},
    {k:"to", label:"End pitch", kind:"freq"},
    {k:"dur", label:"Length", kind:"lin", min:.01, max:2, step:.005, unit:"s"},
    {k:"vol", label:"Volume", kind:"lin", min:0, max:1, step:.01},
    {k:"delay", label:"Delay", kind:"lin", min:0, max:2, step:.005, unit:"s"},
    {k:"attack", label:"Attack", kind:"lin", min:.001, max:.3, step:.001, unit:"s"},
  ],
  noise:[
    {k:"from", label:"Filter start", kind:"freq"},
    {k:"to", label:"Filter end", kind:"freq"},
    {k:"dur", label:"Length", kind:"lin", min:.01, max:2, step:.005, unit:"s"},
    {k:"vol", label:"Volume", kind:"lin", min:0, max:1, step:.01},
    {k:"delay", label:"Delay", kind:"lin", min:0, max:2, step:.005, unit:"s"},
  ],
};

let uid = 1;
const withIds = ls => ls.map(l => ({...l, id: uid++}));
let state = { name:"coin", layers: withIds(PRESETS[3].layers) };
let sel = state.layers[0].id;
let library = [];
try { library = JSON.parse(localStorage.getItem("sfxEditor.library") || "[]"); } catch { library = []; }
const persist = () => { try { localStorage.setItem("sfxEditor.library", JSON.stringify(library)); } catch {} };

const $ = id => document.getElementById(id);
const layer = () => state.layers.find(l => l.id === sel) || state.layers[0];
const colorOf = l => COLORS[state.layers.indexOf(l) % COLORS.length];
const r3 = v => +(+v).toFixed(3);

// ---------- playback ----------
let playStart = 0, playEnd = 0;
function playLayers(layers){
  const ctx = sfx.unlock();
  layers.forEach(l => l.kind === "tone" ? sfx.tone(l) : sfx.noise(l));
  playStart = ctx.currentTime;
  playEnd = playStart + Math.max(0, ...layers.map(l => l.delay + l.dur));
}
const play = () => playLayers(state.layers);
let autoTimer;
function autoPlay(){
  if (!$("auto").checked) return;
  clearTimeout(autoTimer); autoTimer = setTimeout(play, 60);
}

// ---------- code export ----------
const fmt = v => String(r3(v));
function layerCode(l){
  if (l.kind === "tone"){
    const p = [`type:"${l.type}"`, `from:${Math.round(l.from)}`];
    if (Math.round(l.to) !== Math.round(l.from)) p.push(`to:${Math.round(l.to)}`);
    p.push(`dur:${fmt(l.dur)}`, `vol:${fmt(l.vol)}`);
    if (r3(l.delay)) p.push(`delay:${fmt(l.delay)}`);
    if (r3(l.attack) !== .005) p.push(`attack:${fmt(l.attack)}`);
    return `  sfx.tone({ ${p.join(", ")} });`;
  }
  const p = [`dur:${fmt(l.dur)}`, `vol:${fmt(l.vol)}`, `from:${Math.round(l.from)}`, `to:${Math.round(l.to)}`];
  if (r3(l.delay)) p.push(`delay:${fmt(l.delay)}`);
  return `  sfx.noise({ ${p.join(", ")} });`;
}
const soundCode = (name, layers) => `sfx.${name} = () => {\n${[...layers].sort((a,b)=>a.delay-b.delay).map(layerCode).join("\n")}\n};`;
const safeName = s => (s.trim().replace(/[^\w$]/g,"_").replace(/^(\d)/,"_$1") || "mySound");

// ---------- rendering: lists ----------
function renderLists(){
  $("presets").innerHTML = "";
  PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "item" + (state.name === p.name ? " on" : "");
    b.innerHTML = `<b>${p.name}</b><small>${p.he}</small>`;
    b.onclick = () => load(p.name, p.layers);
    $("presets").appendChild(b);
  });
  const m = $("mine"); m.innerHTML = "";
  if (!library.length){ m.innerHTML = `<p class="empty">No sounds yet. Edit a sound and click "Save to library".</p>`; return; }
  library.forEach((s, i) => {
    const row = document.createElement("div"); row.style.display = "flex"; row.style.gap = "4px";
    const b = document.createElement("button");
    b.type = "button"; b.className = "item" + (state.name === s.name ? " on" : ""); b.style.flex = "1";
    b.innerHTML = `<b>${s.name}</b><small>${s.layers.length} layers</small>`;
    b.onclick = () => load(s.name, s.layers);
    const x = document.createElement("button");
    x.type = "button"; x.className = "item"; x.title = "Remove from library"; x.setAttribute("aria-label", "Remove " + s.name);
    x.textContent = "×";
    x.onclick = () => { library.splice(i, 1); persist(); renderLists(); renderCode(); toast("Removed from library"); };
    row.append(b, x); m.appendChild(row);
  });
}
function load(name, layers){
  state = { name, layers: withIds(JSON.parse(JSON.stringify(layers))) };
  sel = state.layers[0].id; $("name").value = name;
  renderAll(); play();
}

// ---------- rendering: chips + inspector ----------
function renderChips(){
  const c = $("chips"); c.innerHTML = "";
  state.layers.forEach((l, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (l.id === sel ? " on" : "");
    b.innerHTML = `<i style="background:${colorOf(l)}"></i>${l.kind === "tone" ? l.type : "noise"} ${i+1}`;
    b.onclick = () => { sel = l.id; renderChips(); renderInspector(); drawTimeline(); };
    c.appendChild(b);
  });
}
const toSlider = v => Math.round(Math.log(v / FREQ_MIN) / Math.log(FREQ_MAX / FREQ_MIN) * 1000);
const fromSlider = s => FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, s / 1000);
function show(spec, v){
  if (spec.kind === "freq") return Math.round(v) + " Hz";
  if (spec.unit === "s") return (v < 1 ? Math.round(v*1000) + " ms" : v.toFixed(2) + " s");
  return Math.round(v*100) + "%";
}
function renderInspector(){
  const l = layer(), box = $("insp"); box.innerHTML = "";
  SPEC[l.kind].forEach(spec => {
    const wrap = document.createElement("div"); wrap.className = "ctl";
    const id = "p-" + spec.k;
    if (spec.kind === "wave"){
      wrap.innerHTML = `<div class="row"><label>${spec.label}</label></div><div class="seg" role="group" aria-label="${spec.label}"></div>`;
      const seg = wrap.querySelector(".seg");
      WAVES.forEach(w => {
        const b = document.createElement("button"); b.type = "button"; b.id = "wave-" + w;
        b.className = l.type === w ? "on" : ""; b.setAttribute("aria-pressed", l.type === w);
        b.innerHTML = `<svg viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="${WAVE_PATHS[w]}"/></svg>${w}`;
        b.onclick = () => { l.type = w; renderInspector(); renderChips(); changed(true); };
        seg.appendChild(b);
      });
    } else {
      const isF = spec.kind === "freq";
      wrap.innerHTML = `<div class="row"><label for="${id}">${spec.label}</label><output id="${id}-o">${show(spec, l[spec.k])}</output></div>
        <input type="range" id="${id}" ${isF ? `min="0" max="1000" step="1" value="${toSlider(l[spec.k])}"` : `min="${spec.min}" max="${spec.max}" step="${spec.step}" value="${l[spec.k]}"`}>`;
      const inp = wrap.querySelector("input"), out = wrap.querySelector("output");
      inp.addEventListener("input", () => {
        l[spec.k] = isF ? Math.round(fromSlider(+inp.value)) : +inp.value;
        if (spec.k === "vol" && l.vol < .001) l.vol = .001;
        out.textContent = show(spec, l[spec.k]); changed(false);
      });
      inp.addEventListener("change", () => autoPlay());
    }
    box.appendChild(wrap);
  });
}
function changed(playNow){ drawTimeline(); renderCode(); if (playNow) autoPlay(); }
function renderCode(){ $("code").textContent = soundCode(safeName($("name").value), state.layers); }
function renderAll(){ renderLists(); renderChips(); renderInspector(); drawTimeline(); renderCode(); }

// ---------- timeline ----------
const tl = $("timeline"), tx = tl.getContext("2d");
const ROW = 34, PADX = 14, AXIS = 22;
let geom = { span:1, w:0, dpr:1 };
const endOf = () => Math.max(.1, ...state.layers.map(l => l.delay + l.dur));
function niceSpan(){ const e = endOf() * 1.15; const steps=[.25,.5,1,1.5,2,3,4]; return steps.find(s => s >= e) || Math.ceil(e); }
const xOf = t => PADX + t / geom.span * (geom.w - PADX*2);
const tOf = x => (x - PADX) / (geom.w - PADX*2) * geom.span;
const fY = (f, top, h) => { const n = Math.log(Math.max(FREQ_MIN,f)/FREQ_MIN)/Math.log(FREQ_MAX/FREQ_MIN); return top + h - 4 - n*(h-8); };

function drawTimeline(){
  const dpr = devicePixelRatio || 1, w = tl.clientWidth;
  const h = AXIS + state.layers.length * ROW + 6;
  tl.style.height = h + "px"; tl.width = w * dpr; tl.height = h * dpr;
  tx.setTransform(dpr,0,0,dpr,0,0);
  if (!dragging) geom.span = niceSpan();
  geom.w = w; geom.dpr = dpr;
  tx.clearRect(0,0,w,h);
  // grid + axis
  const step = geom.span <= .5 ? .05 : geom.span <= 1.5 ? .1 : .25;
  tx.font = "11px JetBrains Mono, monospace"; tx.textBaseline = "middle";
  for (let t = 0, i = 0; t <= geom.span + 1e-9; t = +(t + step).toFixed(3), i++){
    const x = xOf(t), major = i % (step === .25 ? 2 : 5) === 0;
    tx.strokeStyle = major ? "#3d3263" : "#2b2249"; tx.lineWidth = 1;
    tx.beginPath(); tx.moveTo(x+.5, AXIS-4); tx.lineTo(x+.5, h); tx.stroke();
    if (major){ tx.fillStyle = "#a69cc9"; tx.textAlign = x < 30 ? "left" : "center"; tx.fillText(Math.round(t*1000) + "ms", x, 9); }
  }
  // layers
  state.layers.forEach((l, i) => {
    const top = AXIS + i*ROW + 3, bh = ROW - 6, x0 = xOf(l.delay), x1 = Math.max(x0 + 4, xOf(l.delay + l.dur));
    const c = colorOf(l), on = l.id === sel;
    tx.globalAlpha = on ? .26 : .14; tx.fillStyle = c;
    roundRect(x0, top, x1-x0, bh, 5); tx.fill();
    tx.globalAlpha = 1; tx.strokeStyle = c; tx.lineWidth = on ? 2 : 1;
    roundRect(x0+.5, top+.5, x1-x0-1, bh-1, 5); tx.stroke();
    // volume envelope (shade)
    if (l.kind === "noise"){
      tx.globalAlpha = .35; tx.fillStyle = c;
      for (let x = x0+3; x < x1-2; x += 3){ const k = (x-x0)/(x1-x0); const r = (1-k)*bh*.45*Math.min(1,l.vol*2); const y = top+bh/2 + (Math.random()-.5)*r*2; tx.fillRect(x, y, 1.5, 1.5); }
      tx.globalAlpha = 1;
    }
    // pitch / filter sweep
    tx.strokeStyle = c; tx.lineWidth = 2; tx.setLineDash(l.kind === "noise" ? [4,3] : []);
    tx.beginPath();
    for (let s = 0; s <= 40; s++){
      const k = s/40, f = l.from * Math.pow(l.to/l.from, k), x = x0 + k*(x1-x0), y = fY(f, top, bh);
      s ? tx.lineTo(x,y) : tx.moveTo(x,y);
    }
    tx.stroke(); tx.setLineDash([]);
    // resize handle
    if (on){ tx.fillStyle = c; tx.fillRect(x1-4, top+bh/2-7, 3, 14); }
  });
  // playhead
  if (sfx.ctx && sfx.ctx.currentTime < playEnd){
    const x = xOf(sfx.ctx.currentTime - playStart);
    tx.strokeStyle = "#efe9ff"; tx.lineWidth = 1.5;
    tx.beginPath(); tx.moveTo(x, AXIS-4); tx.lineTo(x, h); tx.stroke();
  }
}
function roundRect(x,y,w,h,r){ tx.beginPath(); tx.moveTo(x+r,y); tx.arcTo(x+w,y,x+w,y+h,r); tx.arcTo(x+w,y+h,x,y+h,r); tx.arcTo(x,y+h,x,y,r); tx.arcTo(x,y,x+w,y,r); tx.closePath(); }

let dragging = null;
function hit(e){
  const r = tl.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const i = Math.floor((y - AXIS) / ROW), l = state.layers[i];
  if (!l) return null;
  const x0 = xOf(l.delay), x1 = Math.max(x0+4, xOf(l.delay + l.dur));
  if (x < x0 - 4 || x > x1 + 6) return { l, mode:null, x };
  return { l, mode: x > x1 - 8 ? "resize" : "move", x };
}
tl.addEventListener("pointermove", e => {
  if (dragging){
    const dt = tOf(e.clientX - tl.getBoundingClientRect().left) - tOf(dragging.x);
    const l = dragging.l;
    if (dragging.mode === "move") l.delay = Math.max(0, Math.round((dragging.orig + dt)*200)/200);
    else l.dur = Math.min(2, Math.max(.01, Math.round((dragging.orig + dt)*200)/200));
    renderCode(); drawTimeline(); syncInspector();
    return;
  }
  const h = hit(e); tl.style.cursor = !h || !h.mode ? "default" : h.mode === "resize" ? "ew-resize" : "grab";
});
tl.addEventListener("pointerdown", e => {
  const h = hit(e); if (!h) return;
  if (sel !== h.l.id){ sel = h.l.id; renderChips(); renderInspector(); }
  if (h.mode){
    dragging = { l:h.l, mode:h.mode, x:h.x, orig: h.mode === "move" ? h.l.delay : h.l.dur };
    tl.setPointerCapture(e.pointerId); tl.style.cursor = h.mode === "move" ? "grabbing" : "ew-resize";
  }
  drawTimeline();
});
const endDrag = () => { if (dragging){ dragging = null; drawTimeline(); autoPlay(); } };
tl.addEventListener("pointerup", endDrag); tl.addEventListener("pointercancel", endDrag);
function syncInspector(){
  const l = layer();
  ["dur","delay"].forEach(k => {
    const inp = $("p-" + k), out = $("p-" + k + "-o"); if (!inp) return;
    inp.value = l[k]; out.textContent = show({unit:"s"}, l[k]);
  });
}

// ---------- scope ----------
const sc = $("scope"), sx = sc.getContext("2d");
function frame(){
  const dpr = devicePixelRatio || 1, w = sc.clientWidth, h = sc.clientHeight;
  if (sc.width !== w*dpr){ sc.width = w*dpr; sc.height = h*dpr; }
  sx.setTransform(dpr,0,0,dpr,0,0); sx.clearRect(0,0,w,h);
  sx.strokeStyle = "#2b2249"; sx.lineWidth = 1; sx.beginPath(); sx.moveTo(0,h/2); sx.lineTo(w,h/2); sx.stroke();
  if (analyser){
    const d = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(d);
    sx.strokeStyle = "#6ff0c8"; sx.lineWidth = 1.6; sx.beginPath();
    for (let i = 0; i < d.length; i++){ const x = i/(d.length-1)*w, y = d[i]/255*h; i ? sx.lineTo(x,y) : sx.moveTo(x,y); }
    sx.stroke();
  }
  if (sfx.ctx && sfx.ctx.currentTime < playEnd + .05) drawTimeline();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- actions ----------
const rnd = (a,b) => a + Math.random()*(b-a);
const clampF = f => Math.round(Math.min(FREQ_MAX, Math.max(FREQ_MIN, f)));
$("play").onclick = play;
$("solo").onclick = () => playLayers([layer()]);
$("mutate").onclick = () => {
  state.layers.forEach(l => {
    const p = Math.pow(2, rnd(-.25,.25));
    l.from = clampF(l.from * p * Math.pow(2, rnd(-.08,.08)));
    l.to = clampF(l.to * p * Math.pow(2, rnd(-.08,.08)));
    l.dur = r3(Math.min(2, Math.max(.01, l.dur * rnd(.85,1.2))));
    l.vol = r3(Math.min(1, Math.max(.02, l.vol * rnd(.85,1.15))));
    if (l.delay) l.delay = r3(l.delay * rnd(.85,1.15));
  });
  renderInspector(); changed(true);
};
$("random").onclick = () => {
  const n = Math.random() < .5 ? 1 : 2 + Math.floor(Math.random()*2), ls = [];
  let d = 0;
  for (let i = 0; i < n; i++){
    if (i && Math.random() < .2){ ls.push(N(clampF(rnd(1500,6000)), clampF(rnd(80,600)), r3(rnd(.08,.5)), r3(rnd(.15,.4)), r3(d))); }
    else {
      const f = clampF(Math.pow(2, rnd(7.5,11))), dir = Math.random();
      const to = dir < .4 ? f : clampF(f * Math.pow(2, rnd(-2.5,2)));
      ls.push(T(WAVES[Math.floor(Math.random()*4)], f, to, r3(rnd(.04,.35)), r3(rnd(.15,.3)), r3(d)));
    }
    d += rnd(.04,.14);
  }
  state.layers = withIds(ls); sel = state.layers[0].id;
  $("name").value = state.name = "random" + Math.floor(Math.random()*900+100);
  renderAll(); play();
};
$("addTone").onclick = () => { const l = {...T("square",660,660,.12,.2, r3(endOf() > 1.8 ? 0 : endOf())), id:uid++}; state.layers.push(l); sel = l.id; renderChips(); renderInspector(); changed(true); };
$("addNoise").onclick = () => { const l = {...N(3000,300,.2,.3), id:uid++}; state.layers.push(l); sel = l.id; renderChips(); renderInspector(); changed(true); };
$("dup").onclick = () => { const s = layer(); const l = {...s, id:uid++, delay: r3(Math.min(2, s.delay + s.dur))}; state.layers.push(l); sel = l.id; renderChips(); renderInspector(); changed(true); };
$("del").onclick = () => {
  if (state.layers.length < 2){ toast("A sound needs at least one layer"); return; }
  const i = state.layers.indexOf(layer()); state.layers.splice(i,1);
  sel = state.layers[Math.max(0,i-1)].id; renderChips(); renderInspector(); changed(true);
};
$("name").addEventListener("input", () => { state.name = safeName($("name").value); renderCode(); });
$("save").onclick = () => {
  const name = safeName($("name").value), layers = state.layers.map(({id, ...l}) => l);
  const i = library.findIndex(s => s.name === name);
  if (i >= 0) library[i] = {name, layers}; else library.push({name, layers});
  state.name = name; persist(); renderLists(); toast(i >= 0 ? `Updated sfx.${name}` : `Saved sfx.${name}`);
};
$("vol").addEventListener("input", e => { sfx.volume = +e.target.value; if (sfx.master) sfx.master.gain.value = sfx.volume; });

async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { const r = document.createRange(); r.selectNodeContents($("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Copy was blocked. The code is selected, copy it manually"); }
}
$("copyCode").onclick = () => copy($("code").textContent, "Sound code copied");
$("copyHelper").onclick = () => copy(HELPER, "Shared code copied");
$("copyLib").onclick = () => {
  if (!library.length){ toast("Your library is empty"); return; }
  copy(HELPER + "\n\n" + library.map(s => soundCode(s.name, s.layers)).join("\n\n") + "\n", `Copied ${library.length} sounds with the shared code`);
};
let tt; function toast(m){ const t = $("toast"); t.querySelector("span").textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !e.target.matches("input[type=text],input:not([type]),button")){ e.preventDefault(); play(); }
});
addEventListener("resize", drawTimeline);
renderAll();
document.fonts && document.fonts.ready.then(drawTimeline);
</script>

</body></html>
